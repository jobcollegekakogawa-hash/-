<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>やさしいサポート提案</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <p class="eyebrow">子どもも大人も、少し楽に</p>
        <h1>やさしいサポート提案</h1>
        <p class="lead">困りごとを選ぶと、今すぐ試しやすい関わり方を3つ表示します。</p>
      </header>

      <section class="card" aria-labelledby="troubleLabel">
        <label id="troubleLabel" for="troubleSelect">困りごとを選んでください</label>
        <select id="troubleSelect">
          <option value="">選択してください</option>
          <option value="noise">大きな音が苦手</option>
          <option value="crowd">人が多い場所が苦手</option>
          <option value="transition">切り替えが苦手</option>
          <option value="panic">パニックになる</option>
          <option value="mutism">場面緘黙</option>
        </select>
        <button id="showBtn" type="button">おすすめを見る</button>
      </section>

      <section class="card card--result" aria-live="polite">
        <h2>おすすめの関わり方</h2>
        <p id="hint">まずは困りごとを1つ選んでください。</p>
        <ul id="tipsList"></ul>
      </section>

      <section class="card card--note">
        <h2>使い方のコツ</h2>
        <ul>
          <li>1つだけ選んで、表示された3つのうち「できそうな1つ」から試す</li>
          <li>うまくいかなかったら、別の提案に切り替える</li>
          <li>本人の安心を最優先に、短い言葉で落ち着いて伝える</li>
        </ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
